---
name: site
# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test the Worker
        run: npm test

      - name: Build the static site
        run: npm run build

      - name: Validate the Worker bundle (no upload)
        run: npx wrangler deploy --dry-run --outdir dist-worker

      - name: Upload build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-out
          path: out
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kumokage.com
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: site-out
          path: out

      - name: Deploy the Worker and its assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          set -euo pipefail
          check() {
            url="$1"; want="$2"
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              if [ "$code" = "$want" ]; then echo "ok   $code $url"; return 0; fi
              echo "wait $code $url (want $want, attempt $attempt)"; sleep 10
            done
            return 1
          }
          check https://kumokage.com/en 200
          check https://kumokage.com/de 200
          check https://kumokage.com/it 200
          check https://kumokage.com/privacy 200
          check https://kumokage.com/workspace-mcp 200
          check https://kumokage.com/Kumokage-Capability-Statement.pdf 200
          check https://www.kumokage.com/en 301
